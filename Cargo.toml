[workspace]

[package]
name         = "multimux-edge"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.97"
license      = "MIT OR Apache-2.0"
description  = "Axis ACAP on-camera media origin: VDO capture → LL-HLS/DASH (built on multimux)"
repository   = "https://github.com/fishloa/axis-multimux-edge"
publish      = false

[lib]
path = "src/lib.rs"

[[bin]]
name              = "multimux-edge"
path              = "src/bin/multimux-edge.rs"
required-features = ["device"]

[dependencies]
multimux  = "0.11"
transmux  = "0.25"
tokio     = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
tokio-util = "0.7"
axum      = "0.8"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log       = "0.4"
utoipa    = "6"
tower     = { version = "0.5", features = ["util"] }

# device-only (ACAP SDK Docker): acap-rs crates, git-pinned (unpublished 0.0.0).
# fishloa/acap-rs fork: upstream rev 5eed2e2 (branch `fw11-vdo-compat-v2`) plus
# ONE commit that drops the fw12-only VDO_ERROR_NO_VIDEO diagnostic arm, so `vdo`
# compiles against BOTH the firmware-11 SDK 1.15.1 and firmware-12 SDK sysroots
# (upstream only builds against the fw12 VDO API). StreamBuilder::gop_length, the
# fork's other former patch, is upstream now (#249). Back to upstream once the
# fw11 fix lands there.
vdo          = { git = "https://github.com/fishloa/acap-rs", rev = "8f5f3f4d7cc35f5b3bd84f4a18af44f2b9b4d17b", optional = true }
axparameter  = { git = "https://github.com/fishloa/acap-rs", rev = "8f5f3f4d7cc35f5b3bd84f4a18af44f2b9b4d17b", optional = true }
acap-logging = { git = "https://github.com/fishloa/acap-rs", rev = "8f5f3f4d7cc35f5b3bd84f4a18af44f2b9b4d17b", optional = true }
acap-vapix   = { git = "https://github.com/fishloa/acap-rs", rev = "8f5f3f4d7cc35f5b3bd84f4a18af44f2b9b4d17b", optional = true }
# `VdoIngestSession` (src/vdo_source.rs, device-gated) implements
# `media_plane::ingress`'s `Stage`/`IngestSession` traits directly — multimux
# 0.5 (issue #805) deleted `multimux::pipeline::{run_pipeline, SampleSource}`
# in favour of this one ingest architecture, driven by
# `multimux::supervise_driver`/`multimux::source::advance_route` (see
# `src/bin/multimux-edge.rs`). Optional + device-gated, like `vdo` itself,
# since only `vdo_source.rs` needs them; versions pinned to exactly what
# `multimux` 0.11 itself depends on, so `transmux::pipeline::{Sample,
# TrackSpec}`/`media_plane::trunk::RetentionClass` are the *same* types
# `multimux::source::advance_route`/`SessionEvent` expect, not a second,
# semver-incompatible copy.
broadcast-common = { version = "9.4", optional = true }
media-plane      = { version = "0.5", features = ["std"], optional = true }

[features]
default = []
# `device` pulls the ACAP-only crates + `media_plane`/`broadcast-common` (for
# `VdoIngestSession`) + enables the bin. It ONLY builds inside the Axis ACAP
# Native SDK sysroot (vdo-sys needs pkg-config `vdo`). Host builds omit it and
# compile just the pure `convert`/`admin` lib + their tests.
device = ["dep:vdo", "dep:axparameter", "dep:acap-logging", "dep:acap-vapix", "dep:broadcast-common", "dep:media-plane"]

[dev-dependencies]
